<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weekly Edge">
  <title>Weekly Edge</title>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a8ae6"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fond)"/>
  <!-- ligne de base : la limite à ne pas franchir -->
  <path d="M12 47 H52" stroke="#fff" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>
  <!-- un W tracé comme une courbe de cours, dont le dernier jambage dépasse : l'« edge » -->
  <polyline points="13,20 22,41 32,26 40,41 50,14" fill="none" stroke="#fff"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="14" r="5" fill="#1baf7a" stroke="#fff" stroke-width="2.5"/>
</svg>
