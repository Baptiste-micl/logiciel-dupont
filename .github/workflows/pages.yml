name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # toutes les 30 min pendant les heures de Bourse (UTC), du lundi au vendredi
    - cron: "*/30 7-17 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rafraîchir les cours et actualités
        run: python3 generer_donnees.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
